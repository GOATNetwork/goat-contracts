name: test

on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - "main"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
      - run: npm ci
      - run: npm run build
      - run: npm run fmt:check
      - run: npm test
        env:
          GAS_REPORT: "true"
